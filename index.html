<script>
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent += '\n' + m; $('log').scrollTop = 1e9; };
let py, meta = null, rois = [], secLoaded = false;
let pos = {k: 0, r: 0, c: 0};          // cursor in primary voxel indices (slice, row, col)
let lineWidth = 1.5;
const off = document.createElement('canvas');   // native-resolution image, scaled onto the visible canvas

const PY = String.raw`
import os, gc, json, numpy as np, pydicom
P = None; S = None; RS = None; sec_cache = {}

NON_IMAGE = {'RTSTRUCT', 'REG', 'RTPLAN', 'RTDOSE', 'RTRECORD', 'SR', 'PR', 'KO'}

ING, OTHER, FACTOR = {}, {}, {}
VOXEL_BUDGET = 80_000_000      # max secondary voxels kept in memory (~320 MB float32)

def ingest_begin(tag, nfiles, downsample):
    """Start streaming a series in. Files are read one at a time and deleted immediately."""
    global P, S, sec_cache
    S = None; sec_cache = {}
    if tag == 'pri':
        P = None
    ING[tag], OTHER[tag] = [], []
    FACTOR[tag] = dict(n=nfiles, down=bool(downsample), f=None)
    gc.collect()

def ingest(tag, path):
    try:
        d = pydicom.dcmread(path, force=True)
    except Exception:
        os.remove(path); return 'unreadable'
    os.remove(path)
    mod = str(getattr(d, 'Modality', ''))
    if 'PixelData' not in d or mod in NON_IMAGE:
        if mod in ('REG', 'RTSTRUCT'):
            OTHER[tag].append(d)
        return mod or 'other'
    fc = FACTOR[tag]
    if fc['f'] is None:
        f = 1
        if fc['down'] and P is not None:
            sps = min(float(x) for x in d.PixelSpacing)
            f = max(1, int(np.floor(min(P['ps']) / sps + 1e-6)))     # no finer than the primary grid
            while fc['n'] * (int(d.Rows) // f) * (int(d.Columns) // f) > VOXEL_BUDGET:
                f += 1
        fc['f'] = f
    f = fc['f']
    arr = d.pixel_array
    if arr.ndim != 2:
        return 'multiframe-skipped'
    slope = float(getattr(d, 'RescaleSlope', 1) or 1); icpt = float(getattr(d, 'RescaleIntercept', 0) or 0)
    arr = arr.astype(np.float32) * slope + icpt
    if f == 1 and slope.is_integer() and icpt.is_integer() and arr.min() >= -32768 and arr.max() <= 32767:
        arr = arr.astype(np.int16)        # e.g. CT HU: half the memory of float32
    if f > 1:
        r, c = (arr.shape[0] // f) * f, (arr.shape[1] // f) * f
        arr = arr[:r, :c].reshape(r // f, f, c // f, f).mean(axis=(1, 3), dtype=np.float32)
    del d.PixelData
    if hasattr(d, '_pixel_array'):
        d._pixel_array = None
    ING[tag].append((d, arr))
    return mod

def build_series(tag):
    """Pick the largest image series, sort along slice normal, build volume + voxel->patient affine."""
    items = ING.pop(tag, [])
    f = FACTOR[tag]['f'] or 1
    if not items:
        raise ValueError('No image slices with pixel data found')
    groups = {}
    for d, a in items:
        groups.setdefault(str(getattr(d, 'SeriesInstanceUID', '')), []).append((d, a))
    items = None
    sel = max(groups.values(), key=len)
    nseries = len(groups); groups = None; gc.collect()
    iop = np.array(sel[0][0].ImageOrientationPatient, float)
    row, col = iop[:3], iop[3:]
    normal = np.cross(row, col)
    sel.sort(key=lambda t: float(np.dot(normal, np.array(t[0].ImagePositionPatient, float))))
    sl = [t[0] for t in sel]
    d0 = sl[0]             # first slice AFTER sorting (files arrive in arbitrary order)
    dtype = np.int16 if all(t[1].dtype == np.int16 for t in sel) else np.float32
    vol = np.empty((len(sel),) + sel[0][1].shape, dtype)
    for i in range(len(sel)):
        vol[i] = sel[i][1]; sel[i] = None
    sel = None; gc.collect()
    ps0 = [float(x) for x in d0.PixelSpacing]
    ps = [ps0[0] * f, ps0[1] * f]
    pos = np.array([float(np.dot(normal, np.array(d.ImagePositionPatient, float))) for d in sl])
    gap = float(np.median(np.diff(pos))) if len(pos) > 1 else float(getattr(d0, 'SliceThickness', 1) or 1)
    A = np.eye(4)          # (col, row, slice, 1) -> patient mm
    A[:3, 0] = row * ps[1]
    A[:3, 1] = col * ps[0]
    A[:3, 2] = normal * gap
    # block-averaged pixel centre sits (f-1)/2 original pixels in from the original first pixel
    A[:3, 3] = np.array(d0.ImagePositionPatient, float) + row * ps0[1] * (f - 1) / 2 + col * ps0[0] * (f - 1) / 2
    info = dict(modality=str(d0.Modality), n=len(sl), rows=int(vol.shape[1]), cols=int(vol.shape[2]),
                originalRowsCols=[int(d0.Rows), int(d0.Columns)], downsample=f, ps=ps,
                sliceGap=round(gap, 3), patient=str(getattr(d0, 'PatientID', '')),
                series=str(getattr(d0, 'SeriesDescription', '')),
                FoR=str(getattr(d0, 'FrameOfReferenceUID', '')),
                seriesInFolder=nseries, memoryMB=round(vol.nbytes / 1e6),
                range=[float(np.nanmin(vol)), float(np.nanmax(vol))])
    return dict(slices=sl, vol=vol, row=row, col=col, normal=normal, ps=ps, pos=pos, gap=gap, A=A, info=info)

def load(rs_path):
    global P, S, RS, sec_cache
    S = None; sec_cache = {}
    P = build_series('pri')
    sl, ps, row, col, normal, pos = P['slices'], P['ps'], P['row'], P['col'], P['normal'], P['pos']
    uid_to_idx = {d.SOPInstanceUID: i for i, d in enumerate(sl)}
    out = []
    rs = pydicom.dcmread(rs_path, force=True) if rs_path else next((d for d in OTHER.get('pri', []) if d.Modality == 'RTSTRUCT'), None)
    RS = rs
    if rs is not None:
        names = {r.ROINumber: r.ROIName for r in rs.StructureSetROISequence}
        tol = abs(P['gap']) / 2 or 1.0
        unmatched = 0
        for rc in getattr(rs, 'ROIContourSequence', []):
            num = rc.ReferencedROINumber
            color = [int(c) for c in getattr(rc, 'ROIDisplayColor', [255, 255, 0])]
            per_slice, npts = {}, 0
            for c in getattr(rc, 'ContourSequence', []):
                pts = np.array(c.ContourData, float).reshape(-1, 3)
                npts += len(pts)
                idx = None
                if 'ContourImageSequence' in c and len(c.ContourImageSequence):
                    idx = uid_to_idx.get(c.ContourImageSequence[0].ReferencedSOPInstanceUID)
                if idx is None:
                    z = float(np.dot(normal, pts[0]))
                    j = int(np.argmin(np.abs(pos - z)))
                    if abs(pos[j] - z) <= tol + 1e-3:
                        idx = j
                if idx is None:
                    unmatched += 1
                    continue
                ipp = np.array(sl[idx].ImagePositionPatient, float)
                rel = pts - ipp
                x = rel @ row / ps[1]
                y = rel @ col / ps[0]
                per_slice.setdefault(idx, []).append(np.column_stack([x, y]).ravel().round(2).tolist())
            out.append(dict(number=int(num), name=str(names.get(num, f'ROI {num}')), color=color,
                            nContours=sum(len(v) for v in per_slice.values()), nPoints=npts, slices=per_slice))
        P['info']['unmatchedContours'] = unmatched
    return json.dumps(dict(info=P['info'], rois=out))

def matrix_seq(seq):
    M = np.eye(4)
    for m in seq:
        M = np.array(m.FrameOfReferenceTransformationMatrix, float).reshape(4, 4) @ M
    return M

def parse_reg(reg):
    """Return {FoR UID: 4x4 matrix mapping that FoR into the REG's registered FoR}, notes."""
    mats, notes = {}, []
    target = str(getattr(reg, 'FrameOfReferenceUID', ''))
    if 'RegistrationSequence' in reg:
        for it in reg.RegistrationSequence:
            M = np.eye(4)
            for mr in getattr(it, 'MatrixRegistrationSequence', []):
                M = matrix_seq(mr.MatrixSequence) @ M
            mats[str(it.FrameOfReferenceUID)] = M
    if 'DeformableRegistrationSequence' in reg:
        notes.append('Deformable REG: only the rigid pre/post-deformation matrices are applied; the deformation grid is ignored.')
        for it in reg.DeformableRegistrationSequence:
            M = np.eye(4)
            if 'PreDeformationMatrixRegistrationSequence' in it:
                M = np.array(it.PreDeformationMatrixRegistrationSequence[0].FrameOfReferenceTransformationMatrix, float).reshape(4, 4) @ M
            if 'PostDeformationMatrixRegistrationSequence' in it:
                M = np.array(it.PostDeformationMatrixRegistrationSequence[0].FrameOfReferenceTransformationMatrix, float).reshape(4, 4) @ M
            mats[str(it.SourceFrameOfReferenceUID)] = M
    mats.setdefault(target, np.eye(4))
    return mats, target, notes

def load_secondary(reg_path, invert):
    global S, sec_cache
    sec_cache = {}
    reg = pydicom.dcmread(reg_path, force=True) if reg_path else None
    if reg is None:   # fall back to a REG sitting in the secondary folder
        regs = [d for d in OTHER.get('sec', []) if getattr(d, 'Modality', '') == 'REG']
        reg = regs[0] if regs else None
    S = build_series('sec')
    fP, fS = P['info']['FoR'], S['info']['FoR']
    notes = []
    if reg is not None:
        mats, target, notes = parse_reg(reg)
        notes.append('REG frames of reference: ' + ', '.join(('PRIMARY' if k == fP else 'SECONDARY' if k == fS else k) for k in mats))
        if fS not in mats:
            raise ValueError('REG file does not reference the secondary frame of reference ' + fS)
        if fP not in mats:
            raise ValueError('REG file does not reference the primary frame of reference ' + fP)
        T = np.linalg.inv(mats[fS]) @ mats[fP]     # primary patient mm -> secondary patient mm
    elif fP == fS:
        T = np.eye(4); notes.append('No REG file; same frame of reference, using identity.')
    else:
        T = np.eye(4); notes.append('WARNING: no REG file and different frames of reference; using identity.')
    if invert:
        T = np.linalg.inv(T); notes.append('Matrix inverted (debug option).')
    S['T'] = T
    S['Ainv'] = np.linalg.inv(S['A'])
    v = S['vol'][::max(1, S['vol'].shape[0] // 20)]
    lo, hi = np.percentile(v, [1, 99.5])
    info = dict(S['info'], primaryToSecondary=np.round(T, 4).tolist(), notes=notes,
                autoW=float(round(hi - lo, 1)), autoL=float(round((hi + lo) / 2, 1)))
    return json.dumps(info)

_grid = {}
def plane_shape(view):
    n, rows, cols = P['vol'].shape
    return {'ax': (rows, cols), 'sag': (n, rows), 'cor': (n, cols)}[view]

def sec_plane(view, i):
    """Resample the secondary onto a primary plane (trilinear, NaN outside).
    ax: (rows, cols) at slice i; sag: (n, rows) at column i; cor: (n, cols) at row i.
    Sag/cor are returned superior-at-top (slice order flipped)."""
    i = int(i); key = (view, i)
    if key in sec_cache:
        return sec_cache[key]
    h, w = plane_shape(view)
    gk = (view, h, w)
    if gk not in _grid:
        yy, xx = np.mgrid[0:h, 0:w]
        _grid[gk] = (yy.ravel().astype(np.float64), xx.ravel().astype(np.float64))
    yy, xx = _grid[gk]
    one = np.ones_like(xx)
    n = P['vol'].shape[0]
    Ap = P['A'].copy()
    if view == 'ax':
        Ap[:3, 3] = np.array(P['slices'][i].ImagePositionPatient, float)
        pts = np.stack([xx, yy, 0 * one, one])
    elif view == 'sag':
        pts = np.stack([i * one, xx, (n - 1) - yy, one])
    else:
        pts = np.stack([xx, i * one, (n - 1) - yy, one])
    K = S['Ainv'] @ S['T'] @ Ap                    # primary voxel -> secondary voxel
    c, r, k = (K @ pts)[:3]
    vol = S['vol']; nk, nr, nc = vol.shape
    c0, r0, k0 = np.floor(c).astype(int), np.floor(r).astype(int), np.floor(k).astype(int)
    fc, fr, fk = c - c0, r - r0, k - k0
    if nk == 1:
        k0[:] = 0; fk[:] = 0
    ok = (c0 >= 0) & (c0 < nc - 1) & (r0 >= 0) & (r0 < nr - 1) & (k0 >= 0) & (k0 < max(nk - 1, 1))
    c0, r0, k0 = np.clip(c0, 0, nc - 2), np.clip(r0, 0, nr - 2), np.clip(k0, 0, max(nk - 2, 0))
    k1 = np.minimum(k0 + 1, nk - 1)
    def g(kk, rr_, cc_): return vol[kk, rr_, cc_]
    val = ((g(k0, r0, c0) * (1 - fc) + g(k0, r0, c0 + 1) * fc) * (1 - fr) +
           (g(k0, r0 + 1, c0) * (1 - fc) + g(k0, r0 + 1, c0 + 1) * fc) * fr) * (1 - fk) + \
          ((g(k1, r0, c0) * (1 - fc) + g(k1, r0, c0 + 1) * fc) * (1 - fr) +
           (g(k1, r0 + 1, c0) * (1 - fc) + g(k1, r0 + 1, c0 + 1) * fc) * fr) * fk
    out = np.where(ok, val, np.nan).reshape(h, w).astype(np.float32)
    if len(sec_cache) > 60:
        sec_cache.clear()
    sec_cache[key] = out
    return out

def pri_plane(view, i):
    v = P['vol']; i = int(i)
    if view == 'ax':
        return v[i]
    if view == 'sag':
        return v[::-1, :, i]
    return v[::-1, i, :]

def plane_rgba(view, i, ww, wl, which):
    a = sec_plane(view, i) if which == 'sec' else pri_plane(view, i)
    lo = wl - ww / 2
    g = np.clip((np.nan_to_num(np.asarray(a, np.float32), nan=-1e9) - lo) / max(ww, 1e-6) * 255, 0, 255).astype(np.uint8)
    rgba = np.empty(g.shape + (4,), np.uint8)
    rgba[..., 0] = g; rgba[..., 1] = g; rgba[..., 2] = g; rgba[..., 3] = 255
    if which == 'sec':   # tint area outside the secondary dark blue so coverage is visible
        m = np.isnan(a); rgba[m, 0] = 0; rgba[m, 1] = 0; rgba[m, 2] = 40
    return np.frombuffer(rgba.tobytes(), np.uint8)

def export_rs(edits_json):
    """Apply renamed ROI names/colours to a copy of the RTSTRUCT and return the file bytes."""
    import copy, io
    from pydicom.uid import generate_uid
    if RS is None:
        raise ValueError('No RTSTRUCT loaded')
    ds = copy.deepcopy(RS)
    edits = {int(e['number']): e for e in json.loads(edits_json)}
    for r in ds.StructureSetROISequence:
        if int(r.ROINumber) in edits:
            r.ROIName = edits[int(r.ROINumber)]['name'][:64]
    for rc in ds.ROIContourSequence:
        if int(rc.ReferencedROINumber) in edits:
            rc.ROIDisplayColor = [int(x) for x in edits[int(rc.ReferencedROINumber)]['color']]
    new_uid = generate_uid()
    ds.SOPInstanceUID = new_uid
    if hasattr(ds, 'file_meta'):
        ds.file_meta.MediaStorageSOPInstanceUID = new_uid
    buf = io.BytesIO()
    ds.save_as(buf, enforce_file_format=False)
    return np.frombuffer(buf.getvalue(), np.uint8)
`;

(async () => {
  try {
    py = await loadPyodide();
    log('Pyodide ' + py.version + ' loaded. Installing numpy + pydicom…');
    await py.loadPackage(['numpy', 'micropip']);
    await py.runPythonAsync("import micropip\nawait micropip.install('pydicom')");
    await py.runPythonAsync(PY);
    log('pydicom ' + py.runPython('pydicom.__version__') + ' ready. Choose CT + RTSTRUCT, then Load primary.');
    $('go').disabled = false;
  } catch (e) { log('ERROR: ' + e); }
})();

// Stream files into Python one at a time (each is parsed then deleted) to keep memory low
async function ingestFiles(files, tag, downsample) {
  py.globals.get('ingest_begin')(tag, files.length, downsample);
  const ing = py.globals.get('ingest');
  py.FS.mkdirTree('/data');
  const counts = {};
  for (let i = 0; i < files.length; i++) {
    const p = `/data/${tag}_${i}`;
    py.FS.writeFile(p, new Uint8Array(await files[i].arrayBuffer()));
    const m = ing(tag, p);
    counts[m] = (counts[m] || 0) + 1;
    if (i % 50 === 49) { log(`  read ${i + 1} / ${files.length}`); await new Promise(r => setTimeout(r)); }
  }
  log('  files by type: ' + JSON.stringify(counts));
}
async function writeOne(file, tag) {
  if (!file) return '';
  const p = `/data/${tag}${Date.now()}`;
  py.FS.mkdirTree('/data');
  py.FS.writeFile(p, new Uint8Array(await file.arrayBuffer()));
  return p;
}

const hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
const unhex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

$('go').onclick = async () => {
  try {
    const ctFiles = [...$('ctDir').files, ...$('ctFiles').files];
    if (!ctFiles.length) return log('Pick CT files first.');
    const t = performance.now();
    log(`Reading ${ctFiles.length} primary files…`);
    await ingestFiles(ctFiles, 'pri', false);
    const rsPath = await writeOne($('rs').files[0], 'rs');
    const res = JSON.parse(py.globals.get('load')(rsPath));
    meta = res.info;
    rois = res.rois.map(r => ({...r, origName: r.name, visible: true,
      ks: Object.keys(r.slices).map(Number).sort((a, b) => a - b)}));
    log(`Primary parsed in ${((performance.now()-t)/1000).toFixed(1)} s\n` + JSON.stringify(meta));
    pos = {k: Math.floor(meta.n / 2), r: Math.floor(meta.rows / 2), c: Math.floor(meta.cols / 2)};
    buildRoiPanel();
    secLoaded = false; $('vsec').disabled = true; setRadio('view', 'pri');
    $('go2').disabled = false;
    syncSlider(); draw();
  } catch (e) { log('ERROR: ' + e); console.error(e); }
};

$('go2').onclick = async () => {
  try {
    const files = [...$('secDir').files, ...$('secFiles').files];
    if (!files.length) return log('Pick secondary image files first.');
    secLoaded = false; $('vsec').disabled = true; setRadio('view', 'pri'); draw();
    const t = performance.now();
    log(`Reading ${files.length} secondary files…`);
    await ingestFiles(files, 'sec', true);
    const regPath = await writeOne($('reg').files[0], 'reg');
    const info = JSON.parse(py.globals.get('load_secondary')(regPath, $('inv').checked));
    log(`Secondary parsed in ${((performance.now()-t)/1000).toFixed(1)} s\n` + JSON.stringify(info));
    $('sw').value = info.autoW; $('sl2').value = info.autoL;
    secLoaded = true; $('vsec').disabled = false; setRadio('view', 'sec');
    draw();
  } catch (e) { log('ERROR: ' + e); console.error(e); }
};

// ---------- structure panel ----------
function buildRoiPanel() {
  const el = $('rois');
  el.innerHTML = `<b>${rois.length} structures</b><br>
    <button id="allOn">All on</button><button id="allOff">All off</button>
    &nbsp; Line width <input type="range" id="lw" min="0.5" max="5" step="0.5" value="${lineWidth}" style="width:90px"> <span id="lwv">${lineWidth}</span><br>
    <button id="exp" ${rois.length ? '' : 'disabled'}>Download renamed RTSTRUCT</button>
    <table>${rois.map((r, i) => `<tr>
      <td><input type="checkbox" data-i="${i}" class="vis" checked></td>
      <td><input type="color" data-i="${i}" class="col" value="${hex(r.color)}"></td>
      <td><input type="text" data-i="${i}" class="nm" value="${r.name.replace(/"/g, '&quot;')}" title="Original: ${r.origName.replace(/"/g, '&quot;')}"></td>
      <td><small>${r.nContours} contours</small></td>
      <td><button data-i="${i}" class="go" title="Jump to centre slice">&#8982;</button></td></tr>`).join('')}</table>`;
  el.querySelectorAll('.vis').forEach(x => x.onchange = e => { rois[+e.target.dataset.i].visible = e.target.checked; draw(); });
  el.querySelectorAll('.col').forEach(x => x.oninput = e => { rois[+e.target.dataset.i].color = unhex(e.target.value); draw(); });
  el.querySelectorAll('.nm').forEach(x => x.oninput = e => {
    const r = rois[+e.target.dataset.i]; r.name = e.target.value;
    e.target.classList.toggle('renamed', r.name !== r.origName);
  });
  el.querySelectorAll('.go').forEach(x => x.onclick = e => {
    const r = rois[+e.target.dataset.i]; if (!r.ks.length) return;
    const k = r.ks[Math.floor(r.ks.length / 2)];
    const pts = r.slices[k].flat(); let sx = 0, sy = 0;
    for (let j = 0; j < pts.length; j += 2) { sx += pts[j]; sy += pts[j + 1]; }
    pos = {k, c: Math.round(sx / (pts.length / 2)), r: Math.round(sy / (pts.length / 2))};
    syncSlider(); draw();
  });
  $('allOn').onclick = () => setAll(true); $('allOff').onclick = () => setAll(false);
  $('lw').oninput = e => { lineWidth = +e.target.value; $('lwv').textContent = lineWidth; draw(); };
  $('exp').onclick = exportRs;
}
function setAll(v) { rois.forEach(r => r.visible = v); $('rois').querySelectorAll('.vis').forEach(x => x.checked = v); draw(); }

function exportRs() {
  try {
    const edits = rois.map(r => ({number: r.number, name: r.name, color: r.color}));
    const proxy = py.globals.get('export_rs')(JSON.stringify(edits));
    const bytes = proxy.toJs(); proxy.destroy();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], {type: 'application/dicom'}));
    a.download = 'RS_renamed.dcm'; a.click();
    const n = rois.filter(r => r.name !== r.origName).length;
    log(`Exported RTSTRUCT with ${n} renamed structure(s) and a new SOP Instance UID.`);
  } catch (e) { log('ERROR: ' + e); }
}

// ---------- planes ----------
const radio = n => document.querySelector(`input[name=${n}]:checked`).value;
const setRadio = (n, v) => { document.querySelector(`input[name=${n}][value=${v}]`).checked = true; };

// image size (native px) and physical size (mm) of each plane
function planeGeom(p) {
  const {n, rows, cols, ps} = meta, gap = Math.abs(meta.sliceGap) || 1;
  if (p === 'ax')  return {w: cols, h: rows, mmW: cols * ps[1], mmH: rows * ps[0], max: n - 1, idx: pos.k};
  if (p === 'sag') return {w: rows, h: n, mmW: rows * ps[0], mmH: n * gap, max: cols - 1, idx: pos.c};
  return               {w: cols, h: n, mmW: cols * ps[1], mmH: n * gap, max: rows - 1, idx: pos.r};
}
function setIdx(p, v) { if (p === 'ax') pos.k = v; else if (p === 'sag') pos.c = v; else pos.r = v; }
function syncSlider() {
  if (!meta) return;
  const g = planeGeom(radio('plane'));
  $('slice').max = g.max; $('slice').value = g.idx;
}

// Structure outline in a sagittal/coronal plane: rasterise each axial contour's crossings with the
// plane line (even-odd), then trace the resulting 2D mask with d3.contours.
function reslicedOutline(r, p, idx, g) {
  if (!r.ks.length) return null;
  const n = meta.n, W = g.w, H = g.h;
  const kmin = r.ks[0], kmax = r.ks[r.ks.length - 1];
  const y0 = (n - 1) - kmax, y1 = (n - 1) - kmin;     // display rows touched
  const bh = y1 - y0 + 3;                               // 1-row padding each side
  const grid = new Float32Array(W * bh);
  let any = false;
  const L = idx;                                        // line position (pixel-centre coords)
  for (const k of r.ks) {
    const xs = [];
    for (const poly of r.slices[k]) {
      const m = poly.length;
      for (let j = 0; j < m; j += 2) {
        const ax = poly[j], ay = poly[j + 1], bx = poly[(j + 2) % m], by = poly[(j + 3) % m];
        // sag: line x = L, crossing gives y (row); cor: line y = L, crossing gives x (col)
        const [u0, v0, u1, v1] = p === 'sag' ? [ax, ay, bx, by] : [ay, ax, by, bx];
        if ((u0 <= L) !== (u1 <= L)) xs.push(v0 + (L - u0) / (u1 - u0) * (v1 - v0));
      }
    }
    if (xs.length < 2) continue;
    xs.sort((a, b) => a - b);
    const row = ((n - 1) - k) - y0 + 1;
    for (let j = 0; j + 1 < xs.length; j += 2) {
      const a = Math.max(0, Math.ceil(xs[j])), b = Math.min(W - 1, Math.floor(xs[j + 1]));
      for (let x = a; x <= b; x++) { grid[row * W + x] = 1; any = true; }
    }
  }
  if (!any) return null;
  const mp = d3.contours().size([W, bh]).thresholds([0.5])(grid)[0];
  return {mp, yoff: y0 - 1};
}

function draw() {
  if (!meta) return;
  const p = radio('plane'), g = planeGeom(p);
  const which = secLoaded && radio('view') === 'sec' ? 'sec' : 'pri';
  const [ww, wl] = which === 'sec' ? [+$('sw').value, +$('sl2').value] : $('wl').value.split(',').map(Number);
  const proxy = py.globals.get('plane_rgba')(p, g.idx, ww, wl, which);
  const buf = proxy.toJs(); proxy.destroy();
  off.width = g.w; off.height = g.h;
  off.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(buf.buffer, buf.byteOffset, buf.length), g.w, g.h), 0, 0);

  // visible canvas: physical aspect ratio, device-pixel sharp
  const dpr = window.devicePixelRatio || 1;
  const maxW = Math.min(window.innerWidth - 380, 760), maxH = window.innerHeight * 0.8;
  const scale = Math.min(maxW / g.mmW, maxH / g.mmH);
  const cssW = Math.round(g.mmW * scale), cssH = Math.round(g.mmH * scale);
  const cv = $('cv');
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  cv.width = cssW * dpr; cv.height = cssH * dpr;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, 0, 0, cv.width, cv.height);
  const sx = cv.width / g.w, sy = cv.height / g.h;     // native image px -> canvas px
  ctx.lineWidth = lineWidth * dpr; ctx.lineJoin = 'round';

  for (const r of rois) {
    if (!r.visible) continue;
    ctx.strokeStyle = `rgb(${r.color})`;
    if (p === 'ax') {
      const cs = r.slices[pos.k]; if (!cs) continue;
      for (const c of cs) {
        ctx.beginPath(); ctx.moveTo((c[0] + .5) * sx, (c[1] + .5) * sy);
        for (let k = 2; k < c.length; k += 2) ctx.lineTo((c[k] + .5) * sx, (c[k + 1] + .5) * sy);
        ctx.closePath(); ctx.stroke();
      }
    } else {
      const o = reslicedOutline(r, p, g.idx, g); if (!o) continue;
      ctx.beginPath();
      for (const poly of o.mp.coordinates) for (const ring of poly) {
        ring.forEach(([x, y], j) => { const X = x * sx, Y = (y + o.yoff) * sy; j ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
        ctx.closePath();
      }
      ctx.stroke();
    }
  }

  if ($('xhair').checked) {      // crosshair = position of the other two planes
    const n = meta.n;
    const [cx, cy] = p === 'ax' ? [pos.c, pos.r] : p === 'sag' ? [pos.r, (n - 1) - pos.k] : [pos.c, (n - 1) - pos.k];
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,0,.45)'; ctx.lineWidth = dpr; ctx.setLineDash([4 * dpr, 4 * dpr]);
    ctx.beginPath(); ctx.moveTo((cx + .5) * sx, 0); ctx.lineTo((cx + .5) * sx, cv.height);
    ctx.moveTo(0, (cy + .5) * sy); ctx.lineTo(cv.width, (cy + .5) * sy); ctx.stroke(); ctx.restore();
  }
  ctx.fillStyle = '#ff0'; ctx.font = `${12 * dpr}px system-ui`;
  const names = {ax: 'AXIAL', sag: 'SAGITTAL', cor: 'CORONAL'};
  ctx.fillText(`${names[p]} · ${which === 'sec' ? 'SECONDARY (registered)' : 'PRIMARY'}`, 6 * dpr, 16 * dpr);
  const lab = p === 'ax' ? ['R', 'L', 'A', 'P'] : p === 'sag' ? ['A', 'P', 'S', 'I'] : ['R', 'L', 'S', 'I'];
  ctx.fillText(lab[0], 6 * dpr, cv.height / 2); ctx.fillText(lab[1], cv.width - 14 * dpr, cv.height / 2);
  ctx.fillText(lab[2], cv.width / 2, 30 * dpr); ctx.fillText(lab[3], cv.width / 2, cv.height - 6 * dpr);
  $('sl').textContent = `${g.idx + 1} / ${g.max + 1}`;
}

// click = move the crosshair (sets position for the other two planes)
$('cv').addEventListener('click', e => {
  if (!meta) return;
  const p = radio('plane'), g = planeGeom(p), rect = e.target.getBoundingClientRect();
  const x = Math.max(0, Math.min(g.w - 1, Math.floor((e.clientX - rect.left) / rect.width * g.w)));
  const y = Math.max(0, Math.min(g.h - 1, Math.floor((e.clientY - rect.top) / rect.height * g.h)));
  const k = (meta.n - 1) - y;
  if (p === 'ax') { pos.c = x; pos.r = y; }
  else if (p === 'sag') { pos.r = x; pos.k = k; }
  else { pos.c = x; pos.k = k; }
  draw();
});
$('slice').oninput = e => { setIdx(radio('plane'), +e.target.value); draw(); };
$('wl').onchange = draw; $('sw').oninput = draw; $('sl2').oninput = draw; $('xhair').onchange = draw;
document.querySelectorAll('input[name=view]').forEach(r => r.onchange = draw);
document.querySelectorAll('input[name=plane]').forEach(r => r.onchange = () => { syncSlider(); draw(); });
window.addEventListener('resize', draw);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  const k = e.key.toLowerCase();
  if (k === 't' && secLoaded) { setRadio('view', radio('view') === 'sec' ? 'pri' : 'sec'); draw(); }
  if (k === 'a' || k === 's' || k === 'c') { setRadio('plane', {a: 'ax', s: 'sag', c: 'cor'}[k]); syncSlider(); draw(); }
});
$('cv').addEventListener('wheel', e => {
  e.preventDefault(); if (!meta) return;
  const p = radio('plane'), g = planeGeom(p);
  setIdx(p, Math.max(0, Math.min(g.max, g.idx + (e.deltaY > 0 ? 1 : -1))));
  syncSlider(); draw();
}, {passive: false});
</script>
</body>
</html>

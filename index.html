<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RT DICOM Pyodide test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:system-ui,sans-serif;background:#111;color:#ddd;margin:16px}
  #wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  canvas{background:#000;max-width:100%;image-rendering:pixelated}
  #rois{font-size:13px;max-height:80vh;overflow:auto}
  .sw{display:inline-block;width:10px;height:10px;margin-right:6px}
  pre{font-size:12px;white-space:pre-wrap;color:#9c9;max-height:30vh;overflow:auto}
  label{margin-right:12px}
  fieldset{border:1px solid #444;margin:0 0 10px;padding:6px 10px}
  input[type=number]{width:70px}
</style>
</head>
<body>
<h3>RT DICOM test (Pyodide + pydicom, files stay on this computer)</h3>
<fieldset><legend>Primary</legend>
  <label>CT folder: <input type="file" id="ctDir" webkitdirectory multiple></label>
  <label>or CT files: <input type="file" id="ctFiles" multiple></label>
  <label>RTSTRUCT: <input type="file" id="rs"></label>
  <button id="go" disabled>Load primary</button>
</fieldset>
<fieldset><legend>Secondary</legend>
  <label>Image folder: <input type="file" id="secDir" webkitdirectory multiple></label>
  <label>or image files: <input type="file" id="secFiles" multiple></label>
  <label>REG file: <input type="file" id="reg"></label>
  <label><input type="checkbox" id="inv"> invert matrix</label>
  <button id="go2" disabled>Load secondary</button>
</fieldset>
<p>
  View: <label><input type="radio" name="view" value="pri" checked> Primary</label>
  <label><input type="radio" name="view" value="sec" id="vsec" disabled> Secondary</label>
  <small>(T to toggle)</small>
  &nbsp; Slice <input type="range" id="slice" min="0" max="0" value="0" style="width:300px"> <span id="sl"></span>
</p>
<p>
  CT W/L: <select id="wl">
    <option value="400,40">Soft tissue 400/40</option>
    <option value="1600,-600">Lung 1600/-600</option>
    <option value="2000,300">Bone 2000/300</option>
  </select>
  &nbsp; Secondary W <input type="number" id="sw"> L <input type="number" id="sl2">
</p>
<pre id="log">Loading Pyodide…</pre>
<div id="wrap"><canvas id="cv"></canvas><div id="rois"></div></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.29.0/full/pyodide.js"></script>
<script>
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent += '\n' + m; $('log').scrollTop = 1e9; };
let py, meta = null, rois = [], cur = 0, secLoaded = false;

const PY = String.raw`
import os, gc, json, numpy as np, pydicom
P = None; S = None; sec_cache = {}

NON_IMAGE = {'RTSTRUCT', 'REG', 'RTPLAN', 'RTDOSE', 'RTRECORD', 'SR', 'PR', 'KO'}

ING, OTHER, FACTOR = {}, {}, {}
VOXEL_BUDGET = 60_000_000      # max secondary voxels kept in memory (~240 MB float32)

def ingest_begin(tag, nfiles, downsample):
    """Start streaming a series in. Files are read one at a time and deleted immediately."""
    global P, S, sec_cache
    S = None; sec_cache = {}
    if tag == 'pri':
        P = None
    ING[tag], OTHER[tag] = [], []
    FACTOR[tag] = dict(n=nfiles, down=bool(downsample), f=None)
    gc.collect()

def ingest(tag, path):
    try:
        d = pydicom.dcmread(path, force=True)
    except Exception:
        os.remove(path); return 'unreadable'
    os.remove(path)
    mod = str(getattr(d, 'Modality', ''))
    if 'PixelData' not in d or mod in NON_IMAGE:
        if mod in ('REG', 'RTSTRUCT'):
            OTHER[tag].append(d)
        return mod or 'other'
    fc = FACTOR[tag]
    if fc['f'] is None:
        f = 1
        if fc['down'] and P is not None:
            sps = min(float(x) for x in d.PixelSpacing)
            f = max(1, int(np.floor(min(P['ps']) / sps + 1e-6)))     # no finer than the primary grid
            while fc['n'] * (int(d.Rows) // f) * (int(d.Columns) // f) > VOXEL_BUDGET:
                f += 1
        fc['f'] = f
    f = fc['f']
    arr = d.pixel_array
    if arr.ndim != 2:
        return 'multiframe-skipped'
    arr = arr.astype(np.float32) * float(getattr(d, 'RescaleSlope', 1) or 1) + float(getattr(d, 'RescaleIntercept', 0) or 0)
    if f > 1:
        r, c = (arr.shape[0] // f) * f, (arr.shape[1] // f) * f
        arr = arr[:r, :c].reshape(r // f, f, c // f, f).mean(axis=(1, 3), dtype=np.float32)
    del d.PixelData
    if hasattr(d, '_pixel_array'):
        d._pixel_array = None
    ING[tag].append((d, arr))
    return mod

def build_series(tag):
    """Pick the largest image series, sort along slice normal, build volume + voxel->patient affine."""
    items = ING.pop(tag, [])
    f = FACTOR[tag]['f'] or 1
    if not items:
        raise ValueError('No image slices with pixel data found')
    groups = {}
    for d, a in items:
        groups.setdefault(str(getattr(d, 'SeriesInstanceUID', '')), []).append((d, a))
    items = None
    sel = max(groups.values(), key=len)
    nseries = len(groups); groups = None; gc.collect()
    d0 = sel[0][0]
    iop = np.array(d0.ImageOrientationPatient, float)
    row, col = iop[:3], iop[3:]
    normal = np.cross(row, col)
    sel.sort(key=lambda t: float(np.dot(normal, np.array(t[0].ImagePositionPatient, float))))
    sl = [t[0] for t in sel]
    vol = np.empty((len(sel),) + sel[0][1].shape, np.float32)
    for i in range(len(sel)):
        vol[i] = sel[i][1]; sel[i] = None
    sel = None; gc.collect()
    ps0 = [float(x) for x in d0.PixelSpacing]
    ps = [ps0[0] * f, ps0[1] * f]
    pos = np.array([float(np.dot(normal, np.array(d.ImagePositionPatient, float))) for d in sl])
    gap = float(np.median(np.diff(pos))) if len(pos) > 1 else float(getattr(d0, 'SliceThickness', 1) or 1)
    A = np.eye(4)          # (col, row, slice, 1) -> patient mm
    A[:3, 0] = row * ps[1]
    A[:3, 1] = col * ps[0]
    A[:3, 2] = normal * gap
    # block-averaged pixel centre sits (f-1)/2 original pixels in from the original first pixel
    A[:3, 3] = np.array(d0.ImagePositionPatient, float) + row * ps0[1] * (f - 1) / 2 + col * ps0[0] * (f - 1) / 2
    info = dict(modality=str(d0.Modality), n=len(sl), rows=int(vol.shape[1]), cols=int(vol.shape[2]),
                originalRowsCols=[int(d0.Rows), int(d0.Columns)], downsample=f, ps=ps,
                sliceGap=round(gap, 3), patient=str(getattr(d0, 'PatientID', '')),
                series=str(getattr(d0, 'SeriesDescription', '')),
                FoR=str(getattr(d0, 'FrameOfReferenceUID', '')),
                seriesInFolder=nseries, memoryMB=round(vol.nbytes / 1e6),
                range=[float(np.nanmin(vol)), float(np.nanmax(vol))])
    return dict(slices=sl, vol=vol, row=row, col=col, normal=normal, ps=ps, pos=pos, gap=gap, A=A, info=info)

def load(rs_path):
    global P, S, sec_cache
    S = None; sec_cache = {}
    P = build_series('pri')
    sl, ps, row, col, normal, pos = P['slices'], P['ps'], P['row'], P['col'], P['normal'], P['pos']
    uid_to_idx = {d.SOPInstanceUID: i for i, d in enumerate(sl)}
    out = []
    rs = pydicom.dcmread(rs_path, force=True) if rs_path else next((d for d in OTHER.get('pri', []) if d.Modality == 'RTSTRUCT'), None)
    if rs is not None:
        names = {r.ROINumber: r.ROIName for r in rs.StructureSetROISequence}
        tol = abs(P['gap']) / 2 or 1.0
        unmatched = 0
        for rc in getattr(rs, 'ROIContourSequence', []):
            num = rc.ReferencedROINumber
            color = [int(c) for c in getattr(rc, 'ROIDisplayColor', [255, 255, 0])]
            per_slice, npts = {}, 0
            for c in getattr(rc, 'ContourSequence', []):
                pts = np.array(c.ContourData, float).reshape(-1, 3)
                npts += len(pts)
                idx = None
                if 'ContourImageSequence' in c and len(c.ContourImageSequence):
                    idx = uid_to_idx.get(c.ContourImageSequence[0].ReferencedSOPInstanceUID)
                if idx is None:
                    z = float(np.dot(normal, pts[0]))
                    j = int(np.argmin(np.abs(pos - z)))
                    if abs(pos[j] - z) <= tol + 1e-3:
                        idx = j
                if idx is None:
                    unmatched += 1
                    continue
                ipp = np.array(sl[idx].ImagePositionPatient, float)
                rel = pts - ipp
                x = rel @ row / ps[1]
                y = rel @ col / ps[0]
                per_slice.setdefault(idx, []).append(np.column_stack([x, y]).ravel().round(2).tolist())
            out.append(dict(name=str(names.get(num, f'ROI {num}')), color=color,
                            nContours=sum(len(v) for v in per_slice.values()), nPoints=npts, slices=per_slice))
        P['info']['unmatchedContours'] = unmatched
    return json.dumps(dict(info=P['info'], rois=out))

def matrix_seq(seq):
    M = np.eye(4)
    for m in seq:
        M = np.array(m.FrameOfReferenceTransformationMatrix, float).reshape(4, 4) @ M
    return M

def parse_reg(reg):
    """Return {FoR UID: 4x4 matrix mapping that FoR into the REG's registered FoR}, notes."""
    mats, notes = {}, []
    target = str(getattr(reg, 'FrameOfReferenceUID', ''))
    if 'RegistrationSequence' in reg:
        for it in reg.RegistrationSequence:
            M = np.eye(4)
            for mr in getattr(it, 'MatrixRegistrationSequence', []):
                M = matrix_seq(mr.MatrixSequence) @ M
            mats[str(it.FrameOfReferenceUID)] = M
    if 'DeformableRegistrationSequence' in reg:
        notes.append('Deformable REG: only the rigid pre/post-deformation matrices are applied; the deformation grid is ignored.')
        for it in reg.DeformableRegistrationSequence:
            M = np.eye(4)
            if 'PreDeformationMatrixRegistrationSequence' in it:
                M = np.array(it.PreDeformationMatrixRegistrationSequence[0].FrameOfReferenceTransformationMatrix, float).reshape(4, 4) @ M
            if 'PostDeformationMatrixRegistrationSequence' in it:
                M = np.array(it.PostDeformationMatrixRegistrationSequence[0].FrameOfReferenceTransformationMatrix, float).reshape(4, 4) @ M
            mats[str(it.SourceFrameOfReferenceUID)] = M
    mats.setdefault(target, np.eye(4))
    return mats, target, notes

def load_secondary(reg_path, invert):
    global S, sec_cache
    sec_cache = {}
    reg = pydicom.dcmread(reg_path, force=True) if reg_path else None
    if reg is None:   # fall back to a REG sitting in the secondary folder
        regs = [d for d in OTHER.get('sec', []) if getattr(d, 'Modality', '') == 'REG']
        reg = regs[0] if regs else None
    S = build_series('sec')
    fP, fS = P['info']['FoR'], S['info']['FoR']
    notes = []
    if reg is not None:
        mats, target, notes = parse_reg(reg)
        notes.append('REG frames of reference: ' + ', '.join(('PRIMARY' if k == fP else 'SECONDARY' if k == fS else k) for k in mats))
        if fS not in mats:
            raise ValueError('REG file does not reference the secondary frame of reference ' + fS)
        if fP not in mats:
            raise ValueError('REG file does not reference the primary frame of reference ' + fP)
        T = np.linalg.inv(mats[fS]) @ mats[fP]     # primary patient mm -> secondary patient mm
    elif fP == fS:
        T = np.eye(4); notes.append('No REG file; same frame of reference, using identity.')
    else:
        T = np.eye(4); notes.append('WARNING: no REG file and different frames of reference; using identity.')
    if invert:
        T = np.linalg.inv(T); notes.append('Matrix inverted (debug option).')
    S['T'] = T
    S['Ainv'] = np.linalg.inv(S['A'])
    v = S['vol'][::max(1, S['vol'].shape[0] // 20)]
    lo, hi = np.percentile(v, [1, 99.5])
    info = dict(S['info'], primaryToSecondary=np.round(T, 4).tolist(), notes=notes,
                autoW=float(round(hi - lo, 1)), autoL=float(round((hi + lo) / 2, 1)))
    return json.dumps(info)

_grid = {}
def sec_slice(i):
    """Resample the secondary volume onto primary slice i (trilinear, 0 outside)."""
    i = int(i)
    if i in sec_cache:
        return sec_cache[i]
    rows, cols = P['info']['rows'], P['info']['cols']
    key = (rows, cols)
    if key not in _grid:
        rr, cc = np.mgrid[0:rows, 0:cols]
        _grid[key] = np.stack([cc.ravel(), rr.ravel(), np.zeros(rows * cols), np.ones(rows * cols)]).astype(np.float64)
    Ai = P['A'].copy()
    Ai[:3, 3] = np.array(P['slices'][i].ImagePositionPatient, float)
    K = S['Ainv'] @ S['T'] @ Ai                    # primary (c, r, 0) -> secondary (c, r, k)
    c, r, k = (K @ _grid[key])[:3]
    vol = S['vol']; nk, nr, nc = vol.shape
    c0, r0, k0 = np.floor(c).astype(int), np.floor(r).astype(int), np.floor(k).astype(int)
    fc, fr, fk = c - c0, r - r0, k - k0
    if nk == 1:
        k0[:] = 0; fk[:] = 0
    ok = (c0 >= 0) & (c0 < nc - 1) & (r0 >= 0) & (r0 < nr - 1) & (k0 >= 0) & (k0 < max(nk - 1, 1))
    c0, r0, k0 = np.clip(c0, 0, nc - 2), np.clip(r0, 0, nr - 2), np.clip(k0, 0, max(nk - 2, 0))
    k1 = np.minimum(k0 + 1, nk - 1)
    def g(kk, rr_, cc_): return vol[kk, rr_, cc_]
    val = ((g(k0, r0, c0) * (1 - fc) + g(k0, r0, c0 + 1) * fc) * (1 - fr) +
           (g(k0, r0 + 1, c0) * (1 - fc) + g(k0, r0 + 1, c0 + 1) * fc) * fr) * (1 - fk) + \
          ((g(k1, r0, c0) * (1 - fc) + g(k1, r0, c0 + 1) * fc) * (1 - fr) +
           (g(k1, r0 + 1, c0) * (1 - fc) + g(k1, r0 + 1, c0 + 1) * fc) * fr) * fk
    out = np.where(ok, val, np.nan).reshape(rows, cols).astype(np.float32)
    if len(sec_cache) > 40:
        sec_cache.clear()
    sec_cache[i] = out
    return out

def slice_rgba(i, ww, wl, which):
    a = sec_slice(i) if which == 'sec' else P['vol'][int(i)]
    lo = wl - ww / 2
    g = np.clip((np.nan_to_num(a, nan=-1e9) - lo) / max(ww, 1e-6) * 255, 0, 255).astype(np.uint8)
    rgba = np.empty(g.shape + (4,), np.uint8)
    rgba[..., 0] = g; rgba[..., 1] = g; rgba[..., 2] = g; rgba[..., 3] = 255
    if which == 'sec':   # tint outside-of-secondary area dark blue so the coverage is visible
        m = np.isnan(a); rgba[m, 0] = 0; rgba[m, 1] = 0; rgba[m, 2] = 40
    return rgba.tobytes()
`;

(async () => {
  try {
    py = await loadPyodide();
    log('Pyodide ' + py.version + ' loaded. Installing numpy + pydicom…');
    await py.loadPackage(['numpy', 'micropip']);
    await py.runPythonAsync("import micropip\nawait micropip.install('pydicom')");
    await py.runPythonAsync(PY);
    log('pydicom ' + py.runPython('pydicom.__version__') + ' ready. Choose CT + RTSTRUCT, then Load primary.');
    $('go').disabled = false;
  } catch (e) { log('ERROR: ' + e); }
})();

// Stream files into Python one at a time (each is parsed then deleted) to keep memory low
async function ingestFiles(files, tag, downsample) {
  py.globals.get('ingest_begin')(tag, files.length, downsample);
  const ing = py.globals.get('ingest');
  py.FS.mkdirTree('/data');
  const counts = {};
  for (let i = 0; i < files.length; i++) {
    const p = `/data/${tag}_${i}`;
    py.FS.writeFile(p, new Uint8Array(await files[i].arrayBuffer()));
    const m = ing(tag, p);
    counts[m] = (counts[m] || 0) + 1;
    if (i % 50 === 49) { log(`  read ${i + 1} / ${files.length}`); await new Promise(r => setTimeout(r)); }
  }
  log('  files by type: ' + JSON.stringify(counts));
}
async function writeOne(file, tag) {
  if (!file) return '';
  const p = `/data/${tag}${Date.now()}`;
  py.FS.mkdirTree('/data');
  py.FS.writeFile(p, new Uint8Array(await file.arrayBuffer()));
  return p;
}

$('go').onclick = async () => {
  try {
    const ctFiles = [...$('ctDir').files, ...$('ctFiles').files];
    if (!ctFiles.length) return log('Pick CT files first.');
    const t = performance.now();
    log(`Reading ${ctFiles.length} primary files…`);
    await ingestFiles(ctFiles, 'pri', false);
    const rsPath = await writeOne($('rs').files[0], 'rs');
    const res = JSON.parse(py.globals.get('load')(rsPath));
    meta = res.info; rois = res.rois;
    log(`Primary parsed in ${((performance.now()-t)/1000).toFixed(1)} s\n` + JSON.stringify(meta));
    const cv = $('cv');
    cv.width = meta.cols; cv.height = meta.rows;
    cv.style.width = 'min(90vw, 640px)';
    cv.style.aspectRatio = (meta.cols * meta.ps[1]) + ' / ' + (meta.rows * meta.ps[0]);
    $('slice').max = meta.n - 1; cur = Math.floor(meta.n / 2); $('slice').value = cur;
    $('rois').innerHTML = '<b>' + rois.length + ' structures</b><br>' + rois.map(r =>
      `<div><span class="sw" style="background:rgb(${r.color})"></span>${r.name} <small>(${r.nContours} contours, ${r.nPoints} pts)</small></div>`).join('');
    secLoaded = false; $('vsec').disabled = true; setView('pri');
    $('go2').disabled = false;
    draw();
  } catch (e) { log('ERROR: ' + e); console.error(e); }
};

$('go2').onclick = async () => {
  try {
    const files = [...$('secDir').files, ...$('secFiles').files];
    if (!files.length) return log('Pick secondary image files first.');
    secLoaded = false; $('vsec').disabled = true; setView('pri'); draw();
    const t = performance.now();
    log(`Reading ${files.length} secondary files…`);
    await ingestFiles(files, 'sec', true);
    const regPath = await writeOne($('reg').files[0], 'reg');
    const info = JSON.parse(py.globals.get('load_secondary')(regPath, $('inv').checked));
    log(`Secondary parsed in ${((performance.now()-t)/1000).toFixed(1)} s\n` + JSON.stringify(info));
    $('sw').value = info.autoW; $('sl2').value = info.autoL;
    secLoaded = true; $('vsec').disabled = false; setView('sec');
    draw();
  } catch (e) { log('ERROR: ' + e); console.error(e); }
};

function view() { return document.querySelector('input[name=view]:checked').value; }
function setView(v) { document.querySelector(`input[name=view][value=${v}]`).checked = true; }

function draw() {
  if (!meta) return;
  const which = secLoaded && view() === 'sec' ? 'sec' : 'pri';
  const [ww, wl] = which === 'sec' ? [+$('sw').value, +$('sl2').value] : $('wl').value.split(',').map(Number);
  const proxy = py.globals.get('slice_rgba')(cur, ww, wl, which);
  const buf = proxy.toJs(); proxy.destroy();
  const ctx = $('cv').getContext('2d');
  ctx.putImageData(new ImageData(new Uint8ClampedArray(buf.buffer, buf.byteOffset, buf.length), meta.cols, meta.rows), 0, 0);
  ctx.lineWidth = 1;
  for (const r of rois) {
    const cs = r.slices[cur]; if (!cs) continue;
    ctx.strokeStyle = `rgb(${r.color})`;
    for (const c of cs) {
      ctx.beginPath(); ctx.moveTo(c[0], c[1]);
      for (let k = 2; k < c.length; k += 2) ctx.lineTo(c[k], c[k+1]);
      ctx.closePath(); ctx.stroke();
    }
  }
  ctx.fillStyle = '#ff0'; ctx.font = '12px system-ui';
  ctx.fillText(which === 'sec' ? 'SECONDARY (registered)' : 'PRIMARY', 6, 16);
  $('sl').textContent = `${cur + 1} / ${meta.n}`;
}

$('slice').oninput = e => { cur = +e.target.value; draw(); };
$('wl').onchange = draw; $('sw').oninput = draw; $('sl2').oninput = draw;
document.querySelectorAll('input[name=view]').forEach(r => r.onchange = draw);
document.addEventListener('keydown', e => {
  if ((e.key === 't' || e.key === 'T') && secLoaded && e.target.tagName !== 'INPUT') {
    setView(view() === 'sec' ? 'pri' : 'sec'); draw();
  }
});
$('cv').addEventListener('wheel', e => {
  e.preventDefault(); if (!meta) return;
  cur = Math.max(0, Math.min(meta.n - 1, cur + (e.deltaY > 0 ? 1 : -1)));
  $('slice').value = cur; draw();
}, {passive: false});
</script>
</body>
</html>
